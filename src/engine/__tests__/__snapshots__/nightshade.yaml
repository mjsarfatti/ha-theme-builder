# Generated by HA Theme Builder.
# Paste into your themes file, then pick the theme in Profile → Themes.
# rgb-* companions are omitted: Home Assistant derives one automatically for
# every hex value, and every value below is a hex.
#
# This theme uses Figtree, Fraunces, Source Serif 4, JetBrains Mono, which Home
# Assistant does not ship (it bundles Roboto only). A theme can name a font
# but cannot load one, so pair this with the extra_module_url loader snippet.

Nightshade:
  # Typography
  ha-font-size-scale: "1"
  ha-font-family-body: '"Figtree", Roboto, Noto, sans-serif'
  ha-font-family-heading: '"Fraunces", Georgia, serif'
  ha-font-family-longform: '"Source Serif 4", Georgia, serif'
  ha-font-family-code: '"JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, monospace'
  ha-font-weight-body: "400"
  ha-font-weight-heading: "700"
  ha-font-weight-action: "500"

  # Primary ramp
  ha-color-primary-05: "#130c31"
  ha-color-primary-10: "#251b55"
  ha-color-primary-20: "#352673"
  ha-color-primary-30: "#543daf"
  ha-color-primary-40: "#7c5cff"
  ha-color-primary-50: "#9d91ff"
  ha-color-primary-60: "#aaa3ff"
  ha-color-primary-70: "#bcb7ff"
  ha-color-primary-80: "#d8d6ff"
  ha-color-primary-90: "#ececff"
  ha-color-primary-95: "#f6f6ff"

  # Orange ramp (warning)
  ha-color-orange-05: "#200f00"
  ha-color-orange-10: "#301900"
  ha-color-orange-20: "#4c2b00"
  ha-color-orange-30: "#673c00"
  ha-color-orange-40: "#814e00"
  ha-color-orange-50: "#a56800"
  ha-color-orange-60: "#ca8700"
  ha-color-orange-70: "#e0a100"
  ha-color-orange-80: "#e8c47c"
  ha-color-orange-90: "#f3e4c4"
  ha-color-orange-95: "#f9f3e3"

  # Red ramp (error)
  ha-color-red-05: "#29050a"
  ha-color-red-10: "#38080e"
  ha-color-red-20: "#550a17"
  ha-color-red-30: "#720019"
  ha-color-red-40: "#8c001c"
  ha-color-red-50: "#b00020"
  ha-color-red-60: "#d25250"
  ha-color-red-70: "#e5807c"
  ha-color-red-80: "#f0afa9"
  ha-color-red-90: "#fadbd8"
  ha-color-red-95: "#fef0ef"

  # Green ramp (success)
  ha-color-green-05: "#081509"
  ha-color-green-10: "#0c1e0f"
  ha-color-green-20: "#132e18"
  ha-color-green-30: "#183e1e"
  ha-color-green-40: "#1c4e24"
  ha-color-green-50: "#24642b"
  ha-color-green-60: "#2e7d32"
  ha-color-green-70: "#639f5f"
  ha-color-green-80: "#96c28f"
  ha-color-green-90: "#c9e7c1"
  ha-color-green-95: "#e8f7e6"

  # Neutral ramp
  ha-color-neutral-05: "#171218"
  ha-color-neutral-10: "#251d26"
  ha-color-neutral-20: "#3d323e"
  ha-color-neutral-30: "#524554"
  ha-color-neutral-40: "#665968"
  ha-color-neutral-50: "#827583"
  ha-color-neutral-60: "#9f94a0"
  ha-color-neutral-70: "#b7adb8"
  ha-color-neutral-80: "#d1c9d1"
  ha-color-neutral-90: "#e8e5e8"
  ha-color-neutral-95: "#f4f3f4"

  # Extended palette
  red-color: "#fb2c36"
  pink-color: "#f6339a"
  purple-color: "#ad46ff"
  deep-purple-color: "#8e51ff"
  indigo-color: "#615fff"
  blue-color: "#2b7fff"
  light-blue-color: "#00a6f4"
  cyan-color: "#00b8db"
  teal-color: "#00bba7"
  green-color: "#00c950"
  light-green-color: "#7ccf00"
  lime-color: "#c5d500"
  yellow-color: "#f7de00"
  amber-color: "#f0b100"
  orange-color: "#f68f00"
  deep-orange-color: "#ff6900"
  brown-color: "#79716b"
  blue-grey-color: "#62748e"
  light-grey-color: "#b7adb8"
  grey-color: "#9f94a0"
  dark-grey-color: "#827583"
  label-badge-grey: "#9f94a0"

  # Text
  text-primary-color: "#ffffff"
  text-light-primary-color: "#212121"
  text-accent-color: "#ffffff"

  # Brand and status
  primary-color: "#7c5cff"
  dark-primary-color: "#543daf"
  darker-primary-color: "#352673"
  light-primary-color: "#9d91ff"
  accent-color: "#ff4081"
  error-color: "#b00020"
  warning-color: "#e0a100"
  success-color: "#2e7d32"
  info-color: "#00b0ff"

  # Energy
  energy-grid-consumption-color: "#488fc2"
  energy-grid-return-color: "#8353d1"
  energy-solar-color: "#ff9800"
  energy-non-fossil-color: "#0f9d58"
  energy-battery-out-color: "#4db6ac"
  energy-battery-in-color: "#f06292"
  energy-gas-color: "#8e021b"
  energy-water-color: "#00bcd4"

  modes:

    # Light mode
    light:
      # Box shadows
      ha-box-shadow-s: "0 1px 2px 0 #17121814, 0 1px 3px 0 #1712181f"
      ha-box-shadow-m: "0 3px 6px -1px #1712181a, 0 8px 16px -2px #17121826"
      ha-box-shadow-l: "0 6px 12px -3px #1712181f, 0 16px 32px -6px #17121833"

      # Inputs
      input-idle-line-color: "#1712186b"
      input-hover-line-color: "#171218de"
      input-disabled-line-color: "#1712180f"
      input-outlined-idle-border-color: "#17121861"
      input-outlined-hover-border-color: "#171218de"
      input-outlined-disabled-border-color: "#1712180f"
      input-fill-color: "#f4f3f4"
      input-disabled-fill-color: "#e8e5e8"
      input-ink-color: "#171218de"
      input-label-ink-color: "#17121899"
      input-disabled-ink-color: "#1712185e"
      input-dropdown-icon-color: "#1712188a"

      # Text
      primary-text-color: "#171218"
      secondary-text-color: "#665968"
      disabled-text-color: "#9f94a0"
      disabled-color: "#9f94a0"

      # Brand and status
      state-icon-color: "#543daf"

      # Lines and shadows
      divider-color: "#3d323e1f"
      outline-color: "#3d323e1f"
      outline-hover-color: "#3d323e3d"
      shadow-color: "#3d323e29"
      scrollbar-thumb-color: "#b7adb8"

      # Backgrounds
      card-background-color: "#f4f3f4"
      primary-background-color: "#e8e5e8"
      secondary-background-color: "#d1c9d1"
      clear-background-color: "#f4f3f4"

    # Dark mode
    dark:
      # Box shadows
      ha-box-shadow-s: "0 1px 2px 0 #17121866, 0 1px 3px 0 #1712189e"
      ha-box-shadow-m: "0 3px 6px -1px #17121859, 0 8px 16px -2px #17121882"
      ha-box-shadow-l: "0 6px 12px -3px #17121866, 0 16px 32px -6px #171218a8"

      # Inputs
      input-idle-line-color: "#f4f3f46b"
      input-hover-line-color: "#f4f3f4de"
      input-disabled-line-color: "#f4f3f40f"
      input-outlined-idle-border-color: "#f4f3f461"
      input-outlined-hover-border-color: "#f4f3f4de"
      input-outlined-disabled-border-color: "#f4f3f40f"
      input-fill-color: "#3d323e"
      input-disabled-fill-color: "#524554"
      input-ink-color: "#f4f3f4de"
      input-label-ink-color: "#f4f3f499"
      input-disabled-ink-color: "#f4f3f45e"
      input-dropdown-icon-color: "#f4f3f48a"

      # Text
      primary-text-color: "#ffffff"
      secondary-text-color: "#d1c9d1"
      disabled-text-color: "#827583"
      disabled-color: "#827583"

      # Brand and status
      state-icon-color: "#bcb7ff"

      # Lines and shadows
      divider-color: "#d1c9d11f"
      outline-color: "#d1c9d11f"
      outline-hover-color: "#d1c9d13d"
      shadow-color: "#3d323e7a"
      scrollbar-thumb-color: "#524554"

      # Backgrounds
      card-background-color: "#3d323e"
      primary-background-color: "#251d26"
      secondary-background-color: "#524554"
      clear-background-color: "#3d323e"

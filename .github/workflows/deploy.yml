name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

# A newer main deploy replaces a waiting one. A running deploy always finishes.
concurrency:
  group: deploy-main
  cancel-in-progress: false

jobs:
  deploy:
    name: Build and deploy main
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm and Node
        uses: pnpm/setup@v3
        with:
          runtime: node@24
          cache: true

      - name: Build
        run: pnpm build

      - name: Disable Jekyll
        run: touch dist/.nojekyll

      # force: false rebases onto the branch, so a parallel preview deploy is kept.
      # clean-exclude keeps the preview directories of open pull requests.
      - name: Deploy to the gh-pages branch
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          branch: gh-pages
          folder: dist
          force: false
          clean-exclude: |
            pr-preview/
